  <style>

    .text-red-200 { color: #fecaca; }
    .text-red-500 { color: #ef4444; }
    .text-red-700 { color: #b91c1c; }
    .text-amber-400 { color: #fbbf24; }
    .text-amber-200 { color: #fde68a; }
    .text-amber-700 { color: #b45309; }
    .text-emerald-700 { color: #047857; }
    .border-slate-700 { border-color: #334155; }
    .border-slate-800 { border-color: #1e293b; }
    .border-red-500 { border-color: #ef4444; }
    .border-red-700 { border-color: #b91c1c; }
    .border-red-800 { border-color: #991b1b; }

    .border-blue-800 { border-color: #1e40af; }
    .border-purple-800 { border-color: #6b21a8; }
    .min-h-screen { min-height: 100vh; }
    .p-6 { padding: 1.5rem; }

    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-16 { padding-top: 4rem; padding-bottom: 4rem; }
    .mb-1 { margin-bottom: 0.25rem; }

    .mb-4 { margin-bottom: 1rem; }
    .mb-5 { margin-bottom: 1.25rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-5 { margin-top: 1.25rem; }
    .ml-4 { margin-left: 1rem; }
    .max-w-7xl { max-width: 80rem; }
    .max-w-2xl { max-width: 42rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .inline-block { display: inline-block; }
    .grid { display: grid; }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .col-span-1 { grid-column: span 1 / span 1; }
    .col-span-2 { grid-column: span 2 / span 2; }

    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .flex-wrap { flex-wrap: wrap; }

    .text-xs { font-size: 0.75rem; line-height: 1rem; }

    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .w-2\.5 { width: 0.625rem; }
    .h-2\.5 { height: 0.625rem; }

    .transition-colors { transition: color 0.15s ease, background-color 0.15rem ease, border-color 0.15rem ease; }
    button:disabled { cursor: not-allowed; }
    button { cursor: pointer; background: none; border: none; font-family: inherit; }
    .hover\:border-red-500:hover { border-color: #ef4444; }
    .hover\:text-white:hover { color: #fff; }
    .hover\:text-slate-300:hover { color: #cbd5e1; }
    .hover\:bg-slate-700:hover { background-color: #334155; }
    .group:hover .group-hover\:text-red-300 { color: #fca5a5; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const stages = [
      {
        id: 1,
        phase: "Trigger",
        label: "Enrolment Opens",
        student: "Receives notification that enrolment is open. Logs into DegreeWorks to plan and select units for the upcoming study period.",
        system: "DegreeWorks portal is accessible. Student record is loaded.",
        admin: "—",
        emotion: "neutral",
        emotionLabel: "Neutral / Anticipatory",
        painPoint: null,
      },
      {
        id: 2,
        phase: "Exploration",
        label: "Browsing Units",
        student: "Reviews degree plan in DegreeWorks. Identifies required and elective units. Confirms they believe they have met all enrolment conditions.",
        system: "DegreeWorks displays degree audit. Begins querying Banner for enrolment eligibility data.",
        admin: "—",
        emotion: "positive",
        emotionLabel: "Positive / Engaged",
        painPoint: null,
      },
      {
        id: 3,
        phase: "Action",
        label: "Enrolment Attempt",
        student: "Selects desired units and submits enrolment for their Part of Term study period.",
        system: "DegreeWorks triggers Banner to validate enrolment. Banner checks custom Attributes on the student record against enrolment conditions.\n\n⚠ Banner holds outdated Attribute data — conditions were updated in UniCRM but never manually re-entered in Banner. Banner also applies conditions at Term level, not Part of Term level.",
        admin: "—",
        emotion: "neutral",
        emotionLabel: "Neutral / Hopeful",
        painPoint: null,
        isFailurePoint: true,
      },
      {
        id: 4,
        phase: "Failure",
        label: "Error Received",
        student: "Receives a blocking error message. Cannot proceed with enrolment. No explanation of why the condition was triggered or what they need to do.",
        system: "Banner returns an enrolment restriction error based on stale Attribute data. The error is not contextualised for the student.",
        admin: "—",
        emotion: "frustrated",
        emotionLabel: "Confused / Frustrated",
        painPoint: "Student is blocked from enrolling despite legitimately meeting their conditions. The system provides no actionable guidance.",
      },
      {
        id: 5,
        phase: "Recovery",
        label: "Seeking Help",
        student: "Contacts student services via email or phone. Must explain their situation and wait for a response — often during a high-demand enrolment period.",
        system: "No self-service resolution pathway. No error code that maps to a known fix.",
        admin: "Admin receives support request. Must manually investigate the student's record across two separate systems.",
        emotion: "frustrated",
        emotionLabel: "Anxious / Frustrated",
        painPoint: "Student bears the burden of chasing a resolution they shouldn't need. Admin workload spikes during enrolment periods due to systemic failure.",
      },
      {
        id: 6,
        phase: "Investigation",
        label: "Admin Diagnoses",
        student: "Waiting. May attempt to enrol in alternative units or defer decisions, causing downstream planning problems.",
        system: "No audit trail or automated alert exists to flag the Banner/UniCRM discrepancy.",
        admin: "Checks Banner Attributes on the student record. Cross-references against UniCRM. Identifies that the enrolment condition was updated or removed in UniCRM but not reflected in Banner. No integration exists between the two systems.",
        emotion: "negative",
        emotionLabel: "Frustrated / Uncertain (both)",
        painPoint: "The root cause — a data sync gap between UniCRM and Banner — is only discoverable through manual comparison. This is not scalable across a student cohort.",
      },
      {
        id: 7,
        phase: "Workaround",
        label: "Manual Update",
        student: "Waiting for confirmation from admin.",
        system: "Banner Attributes updated manually. However, the update is applied at Term level — not at the specific Part of Term the student is enrolling in. This may not fully resolve the restriction.",
        admin: "Manually updates the Banner Attribute to reflect the current UniCRM state. Cannot guarantee accuracy across all 23 Parts of Term. No way to apply conditions at Part of Term level in Banner.",
        emotion: "negative",
        emotionLabel: "Burdened / Low Confidence",
        painPoint: "Even the manual fix is structurally incomplete. Banner cannot apply enrolment conditions at Part of Term level, meaning the workaround may still fail or produce incorrect results.",
      },
      {
        id: 8,
        phase: "Retry",
        label: "Re-attempt Enrolment",
        student: "Notified by admin to retry. Logs back into DegreeWorks and attempts to enrol again.",
        system: "Enrolment may succeed — or may fail again due to the Term vs Part of Term mismatch. Outcome is inconsistent.",
        admin: "May need to intervene again or manually override if the restriction persists.",
        emotion: "negative",
        emotionLabel: "Anxious / Low Trust",
        painPoint: "The student has lost significant time during a critical enrolment window. Even if this attempt succeeds, confidence in the system is damaged. There is no guarantee the same issue won't recur next study period.",
      },
    ];

    const emotionConfig = {
      neutral:    { bg: "background:#f1f5f9", text: "color:#475569", dot: "#94a3b8", bar: 50 },
      positive:   { bg: "background:#ecfdf5", text: "color:#047857", dot: "#10b981", bar: 80 },
      frustrated: { bg: "background:#fffbeb", text: "color:#b45309", dot: "#f59e0b", bar: 25 },
      negative:   { bg: "background:#fef2f2", text: "color:#b91c1c", dot: "#ef4444", bar: 10 },
    };

    const phaseColors = {
      Trigger:       "#334155",
      Exploration:   "#475569",
      Action:        "#d97706",
      Failure:       "#dc2626",
      Recovery:      "#b91c1c",
      Investigation: "#991b1b",
      Workaround:    "#7f1d1d",
      Retry:         "#9f1239",
    };

    function App() {
      const [activeStage, setActiveStage] = useState(null);
      const [activeTab, setActiveTab] = useState("overview");
      const selected = stages.find((s) => s.id === activeStage);

      const emotionPoints = stages.map((s, i) => ({
        x: (i / (stages.length - 1)) * 100,
        y: 100 - emotionConfig[s.emotion].bar,
        stage: s,
      }));
      const pathD = emotionPoints.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");

      return (
        <div style={{fontFamily:"Georgia,serif", minHeight:"100vh", background:"#020617", color:"#f1f5f9", padding:"1.5rem"}}>
          {/* HEADER */}
          <div style={{maxWidth:"80rem", margin:"0 auto 2rem"}}>
            <div style={{borderBottom:"1px solid #334155", paddingBottom:"1.5rem"}}>
              <div style={{display:"flex", alignItems:"flex-start", justifyContent:"space-between"}}>
                <div>
                  <p style={{fontSize:"0.7rem", fontFamily:"monospace", letterSpacing:"0.1em", color:"#f87171", textTransform:"uppercase", marginBottom:"0.4rem"}}>UX Audit · Ellucian Banner</p>
                  <h1 style={{fontSize:"1.875rem", fontWeight:"bold", color:"white", marginBottom:"0.25rem"}}>Student Enrolment User Journey</h1>
                  <p style={{fontSize:"0.875rem", color:"#94a3b8", maxWidth:"42rem", lineHeight:"1.6"}}>
                    Demonstrates how a student attempting to enrol in units via DegreeWorks is blocked by stale enrolment condition data in Banner — caused by a manual update process, a missing UniCRM integration, and a structural Term vs Part of Term mismatch.
                  </p>
                </div>
                <span style={{display:"inline-block", background:"#7f1d1d", border:"1px solid #991b1b", color:"#fca5a5", fontSize:"0.7rem", fontFamily:"monospace", padding:"3px 12px", borderRadius:"3px", letterSpacing:"2px", whiteSpace:"nowrap", marginTop:"6px"}}>
                  NOT FIT FOR PURPOSE
                </span>
              </div>

              {/* Failure callouts */}
              <div style={{marginTop:"1.25rem", display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:"0.75rem"}}>
                {[
                  {n:"01", title:"No Data Sync", desc:"UniCRM is source of truth; changes don't flow to Banner"},
                  {n:"02", title:"Manual Entry Risk", desc:"Attributes must be manually updated by staff — error-prone and delayed"},
                  {n:"03", title:"Structural Mismatch", desc:"Banner operates at Term level; conditions must apply to 23 Parts of Terms"},
                ].map(f => (
                  <div key={f.n} style={{background:"#0f172a", border:"1px solid #7f1d1d", borderRadius:"4px", padding:"12px 14px"}}>
                    <div style={{fontFamily:"monospace", fontSize:"0.65rem", color:"#f87171", textTransform:"uppercase", marginBottom:"4px"}}>FAILURE POINT {f.n}</div>
                    <div style={{fontSize:"0.875rem", fontWeight:"bold", color:"white", marginBottom:"4px"}}>{f.title}</div>
                    <div style={{fontSize:"0.75rem", color:"#64748b"}}>{f.desc}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Tabs */}
            <div style={{display:"flex", gap:"1rem", marginTop:"1rem", borderBottom:"1px solid #1e293b"}}>
              {["overview","detail"].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)}
                  style={{paddingBottom:"0.75rem", fontSize:"0.7rem", fontFamily:"monospace", letterSpacing:"0.1em", textTransform:"uppercase", background:"none", border:"none", cursor:"pointer", color: activeTab===tab ? "white" : "#64748b", borderBottom: activeTab===tab ? "2px solid #ef4444" : "2px solid transparent", transition:"color 0.15s"}}>
                  {tab === "overview" ? "Journey Overview" : "Stage Detail"}
                </button>
              ))}
            </div>
          </div>

          <div style={{maxWidth:"80rem", margin:"0 auto"}}>
            {activeTab === "overview" && (
              <>
                {/* Emotion curve */}
                <div style={{marginBottom:"1.5rem", background:"#0f172a", borderRadius:"4px", border:"1px solid #1e293b", padding:"1rem"}}>
                  <p style={{fontSize:"0.7rem", fontFamily:"monospace", letterSpacing:"0.1em", color:"#64748b", textTransform:"uppercase", marginBottom:"0.75rem"}}>Student Emotional Journey</p>
                  <div style={{position:"relative", height:"6rem"}}>
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{width:"100%", height:"100%"}}>
                      <defs>
                        <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
                          <stop offset="0%" stopColor="#10b981"/>
                          <stop offset="30%" stopColor="#f59e0b"/>
                          <stop offset="60%" stopColor="#ef4444"/>
                          <stop offset="100%" stopColor="#9f1239"/>
                        </linearGradient>
                      </defs>
                      {[20,50,80].map(y => <line key={y} x1="0" y1={y} x2="100" y2={y} stroke="#1e293b" strokeWidth="0.5"/>)}
                      <path d={pathD} fill="none" stroke="url(#lineGrad)" strokeWidth="1.5" vectorEffect="non-scaling-stroke"/>
                      {emotionPoints.map((p,i) => (
                        <circle key={i} cx={p.x} cy={p.y} r="2" fill={emotionConfig[stages[i].emotion].dot}
                          style={{cursor:"pointer"}} onClick={() => { setActiveStage(stages[i].id); setActiveTab("detail"); }}/>
                      ))}
                    </svg>
                    <div style={{position:"absolute", left:0, top:0, height:"100%", display:"flex", flexDirection:"column", justifyContent:"space-between", color:"#334155", fontSize:"0.7rem", fontFamily:"monospace", paddingRight:"4px", pointerEvents:"none"}}>
                      <span>+</span><span>–</span>
                    </div>
                  </div>
                </div>

                {/* Stage cards */}
                <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"0.75rem", marginBottom:"1.5rem"}}>
                  {stages.map(stage => (
                    <div key={stage.id}
                      onClick={() => { setActiveStage(stage.id); setActiveTab("detail"); }}
                      style={{borderRadius:"4px", border: activeStage===stage.id ? "1px solid #ef4444" : stage.isFailurePoint ? "1px solid #d97706" : "1px solid #1e293b", background:"#0f172a", cursor:"pointer", overflow:"hidden", transition:"border-color 0.15s", boxShadow: activeStage===stage.id ? "0 0 0 1px #ef4444" : "none"}}>
                      <div style={{background: phaseColors[stage.phase]||"#334155", padding:"5px 12px", display:"flex", justifyContent:"space-between"}}>
                        <span style={{fontFamily:"monospace", fontSize:"0.65rem", color:"rgba(255,255,255,0.65)"}}>{stage.phase}</span>
                        <span style={{fontFamily:"monospace", fontSize:"0.65rem", color:"rgba(255,255,255,0.45)"}}>0{stage.id}</span>
                      </div>
                      <div style={{padding:"0.75rem"}}>
                        <h3 style={{fontSize:"0.875rem", fontWeight:"bold", color:"white", marginBottom:"0.5rem"}}>{stage.label}</h3>
                        <p style={{fontSize:"0.72rem", color:"#94a3b8", lineHeight:"1.5", display:"-webkit-box", WebkitLineClamp:3, WebkitBoxOrient:"vertical", overflow:"hidden"}}>{stage.student}</p>
                        {stage.painPoint && (
                          <div style={{marginTop:"0.5rem", display:"flex", alignItems:"flex-start", gap:"4px"}}>
                            <span style={{color:"#f87171", fontSize:"0.72rem", marginTop:"1px", flexShrink:0}}>⚠</span>
                            <p style={{fontSize:"0.72rem", color:"#f87171", lineHeight:"1.4", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", overflow:"hidden"}}>{stage.painPoint}</p>
                          </div>
                        )}
                        <div style={{marginTop:"0.75rem", display:"inline-flex", alignItems:"center", gap:"6px", borderRadius:"20px", padding:"2px 8px", background: emotionConfig[stage.emotion].bg.replace("background:","").trim()}}>
                          <span style={{width:"6px", height:"6px", borderRadius:"50%", background: emotionConfig[stage.emotion].dot, flexShrink:0, display:"inline-block"}}></span>
                          <span style={{fontSize:"0.65rem", ...Object.fromEntries([emotionConfig[stage.emotion].text.split(":").map((s,i)=>i===0?"color":s)])}}>{stage.emotionLabel}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Legend */}
                <div style={{display:"flex", flexWrap:"wrap", gap:"1rem", fontSize:"0.7rem", color:"#64748b", fontFamily:"monospace", borderTop:"1px solid #1e293b", paddingTop:"1rem"}}>
                  {[["#10b981","Positive"],["#94a3b8","Neutral"],["#f59e0b","Frustrated"],["#ef4444","Negative"]].map(([c,l]) => (
                    <span key={l} style={{display:"flex", alignItems:"center", gap:"6px"}}><span style={{width:"10px",height:"10px",borderRadius:"50%",background:c,display:"inline-block"}}></span>{l}</span>
                  ))}
                  <span style={{display:"flex", alignItems:"center", gap:"6px", color:"#f87171", marginLeft:"1rem"}}>⚠ System Pain Point</span>
                  <span style={{color:"#475569"}}>· Click any stage for full detail</span>
                </div>
              </>
            )}

            {activeTab === "detail" && (
              <div>
                {/* Stage selector */}
                <div style={{display:"flex", gap:"0.5rem", flexWrap:"wrap", marginBottom:"1.5rem"}}>
                  {stages.map(s => (
                    <button key={s.id} onClick={() => setActiveStage(s.id)}
                      style={{fontSize:"0.7rem", fontFamily:"monospace", padding:"6px 12px", borderRadius:"4px", border:"none", cursor:"pointer", transition:"all 0.15s", background: activeStage===s.id ? "#dc2626" : "#1e293b", color: activeStage===s.id ? "white" : "#94a3b8"}}>
                      {String(s.id).padStart(2,"0")} {s.label}
                    </button>
                  ))}
                </div>

                {selected ? (
                  <div style={{display:"grid", gridTemplateColumns:"1fr 2fr", gap:"1rem"}}>
                    {/* Left: meta */}
                    <div>
                      <div style={{background: phaseColors[selected.phase]||"#334155", padding:"8px 16px", borderRadius:"4px 4px 0 0"}}>
                        <span style={{fontSize:"0.7rem", fontFamily:"monospace", color:"rgba(255,255,255,0.7)", textTransform:"uppercase"}}>{selected.phase}</span>
                      </div>
                      <div style={{background:"#0f172a", border:"1px solid #1e293b", borderTop:"none", borderRadius:"0 0 4px 4px", padding:"1rem"}}>
                        <h2 style={{fontSize:"1.25rem", fontWeight:"bold", color:"white", marginBottom:"4px"}}>{selected.label}</h2>
                        <p style={{fontSize:"0.7rem", fontFamily:"monospace", color:"#64748b", marginBottom:"1rem"}}>Stage {selected.id} of {stages.length}</p>

                        <div style={{borderRadius:"4px", padding:"0.75rem", marginBottom:"1rem", background: emotionConfig[selected.emotion].bg.replace("background:","").trim()}}>
                          <p style={{fontSize:"0.65rem", fontFamily:"monospace", marginBottom:"4px", color:"#64748b", textTransform:"uppercase"}}>Student Emotion</p>
                          <div style={{display:"flex", alignItems:"center", gap:"8px"}}>
                            <span style={{width:"8px",height:"8px",borderRadius:"50%",background:emotionConfig[selected.emotion].dot,display:"inline-block"}}></span>
                            <span style={{fontSize:"0.875rem", fontWeight:"600", color: emotionConfig[selected.emotion].text.replace("color:","").trim()}}>{selected.emotionLabel}</span>
                          </div>
                        </div>

                        {selected.painPoint && (
                          <div style={{background:"#450a0a", border:"1px solid #991b1b", borderRadius:"4px", padding:"0.75rem", marginBottom:"0.75rem"}}>
                            <p style={{fontSize:"0.65rem", fontFamily:"monospace", color:"#f87171", textTransform:"uppercase", marginBottom:"4px"}}>⚠ Pain Point</p>
                            <p style={{fontSize:"0.875rem", color:"#fecaca", lineHeight:"1.6"}}>{selected.painPoint}</p>
                          </div>
                        )}

                        {selected.isFailurePoint && (
                          <div style={{background:"#1c0e00", border:"1px solid #b45309", borderRadius:"4px", padding:"0.75rem"}}>
                            <p style={{fontSize:"0.65rem", fontFamily:"monospace", color:"#fbbf24", textTransform:"uppercase", marginBottom:"4px"}}>◈ System Failure Originates Here</p>
                            <p style={{fontSize:"0.75rem", color:"#fde68a", lineHeight:"1.6"}}>Banner receives a validation request but evaluates against stale, manually-maintained Attribute data applied at the wrong structural level.</p>
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Right: swimlanes */}
                    <div style={{display:"flex", flexDirection:"column", gap:"0.75rem"}}>
                      <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:"0.75rem"}}>
                        {[
                          {label:"Student", icon:"🎓", content:selected.student, accent: selected.isFailurePoint ? "#1e40af" : "#1e40af"},
                          {label:"System (Banner / DegreeWorks)", icon:"⚙", content:selected.system, accent: selected.isFailurePoint ? "#d97706" : "#334155"},
                          {label:"Admin Staff", icon:"👤", content:selected.admin, accent: selected.admin==="—" ? "#1e293b" : "#6b21a8"},
                        ].map(actor => (
                          <div key={actor.label} style={{background:"#0f172a", border:`1px solid ${actor.accent}`, borderRadius:"4px", overflow:"hidden"}}>
                            <div style={{borderBottom:"1px solid #1e293b", padding:"8px 12px", display:"flex", alignItems:"center", gap:"8px"}}>
                              <span>{actor.icon}</span>
                              <span style={{fontSize:"0.65rem", fontFamily:"monospace", color:"#94a3b8", textTransform:"uppercase", letterSpacing:"0.08em"}}>{actor.label}</span>
                            </div>
                            <div style={{padding:"0.75rem"}}>
                              {actor.content === "—"
                                ? <p style={{color:"#475569", fontSize:"0.875rem", fontStyle:"italic"}}>Not yet involved</p>
                                : <p style={{fontSize:"0.875rem", color:"#cbd5e1", lineHeight:"1.6", whiteSpace:"pre-line"}}>{actor.content}</p>
                              }
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Navigation */}
                      <div style={{display:"flex", justifyContent:"space-between", marginTop:"0.5rem"}}>
                        <button onClick={() => setActiveStage(Math.max(1, selected.id-1))} disabled={selected.id===1}
                          style={{fontSize:"0.7rem", fontFamily:"monospace", color:selected.id===1?"#334155":"#94a3b8", padding:"8px 12px", background:"#0f172a", borderRadius:"4px", border:"1px solid #1e293b", cursor:selected.id===1?"not-allowed":"pointer", opacity:selected.id===1?0.3:1}}>
                          ← Previous Stage
                        </button>
                        <button onClick={() => setActiveStage(Math.min(stages.length, selected.id+1))} disabled={selected.id===stages.length}
                          style={{fontSize:"0.7rem", fontFamily:"monospace", color:selected.id===stages.length?"#334155":"#94a3b8", padding:"8px 12px", background:"#0f172a", borderRadius:"4px", border:"1px solid #1e293b", cursor:selected.id===stages.length?"not-allowed":"pointer", opacity:selected.id===stages.length?0.3:1}}>
                          Next Stage →
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div style={{color:"#64748b", fontSize:"0.875rem", textAlign:"center", padding:"4rem 0"}}>
                    Select a stage above to view full detail
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
